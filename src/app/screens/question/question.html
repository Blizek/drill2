<div class="page-header">
    <div class="pull-right">
        <button ng-if="currentQuestion.relatedLinks.length" class="btn btn-default" type="button" related-links="currentQuestion" title="Related links">
            <glyphicon icon="link"></glyphicon>
            {{currentQuestion.relatedLinks.length}}
        </button>
        <button class="btn btn-default" type="button" question-string="currentQuestion" title="Show question string">
            <glyphicon icon="copy"></glyphicon>
        </button>
        <button class="btn btn-default" type="button" ng-click="copyQuestion()" title="Copy to clipboard">
            <glyphicon icon="save-file"></glyphicon>
        </button>
    </div>
    <h2 title="{{currentQuestion.id != false ? currentQuestion.id : 'No ID'}}">Question {{questionIndex}} out of {{questions.length}}</h2>
</div>
<form ng-submit="nextQuestion()" ng-class="{ graded: view.isGraded() }">
    <div>
        <div ng-show="config.markdown" ng-bind-html="currentQuestion.body | markdown:this"></div>
        <div ng-hide="config.markdown" ng-bind-html="currentQuestion.body | plaintext"></div>
    </div>
    <div class="form-group answers" ng-if="currentQuestion.type !== 'matching'">
        <div class="{{displayAsRadio ? 'radio' : 'checkbox'}} answer no-selection correct-{{answer.correct}} checked-{{displayAsRadio ? (currentQuestion.checkedAnswer == answer.id) : answer.checked}}" ng-class="{ explained: view.isGraded() && config.showExplanations && currentQuestion.hasExplanations }" ng-repeat="answer in currentQuestion.answers | orderBy:'sortingKey'">
            <label>
                <span class="label label-default keyboard-shortcut answer-number"></span>
                <input type="radio" ng-model="currentQuestion.checkedAnswer" ng-value="answer.id" ng-disabled="view.isGraded()" ng-if="displayAsRadio">
                <input type="checkbox" ng-model="answer.checked" ng-disabled="view.isGraded()" ng-else>
                <span class="content">
                    <span class="id" ng-show="view.isGraded() && config.showExplanations && currentQuestion.hasExplanations">{{answer.id}})&nbsp</span>
                    <span ng-bind-html="answer.body | plaintext:'span.p'"></span>
                </span>
            </label>
        </div>
    </div>
    <div class="form-group matching-answers" ng-if="currentQuestion.type === 'matching'">
        <div class="matching-row" ng-repeat="match in currentQuestion.matches" style="margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px dashed #eee; padding-bottom: 10px;">
            <div class="matching-prompt" style="flex: 1; min-width: 200px; padding-right: 15px; font-size: 1.1em;">
                <span ng-bind-html="match.prompt | plaintext:'span.p'"></span>
            </div>
            <div class="matching-select-container" style="display: flex; align-items: center;">
                <select class="form-control" ng-model="match.selected" ng-disabled="view.isGraded()" style="width: 250px; display: inline-block;">
                    <option value="">-- Choose --</option>
                    <option ng-repeat="choice in currentQuestion.shuffledChoices" ng-value="choice">{{choice}}</option>
                </select>
                <span ng-if="view.isGraded()" style="margin-left: 10px;">
                    <span ng-if="match.selected === match.correct" class="text-success" style="font-weight: bold; font-size: 1.2em;">
                        <glyphicon icon="ok"></glyphicon>
                    </span>
                    <span ng-if="match.selected !== match.correct" class="text-danger" style="font-weight: bold; font-size: 1.2em; display: inline-flex; align-items: center; gap: 5px;">
                        <glyphicon icon="remove"></glyphicon>
                        <span style="font-size: 0.85em; font-weight: normal; color: #a94442;">(Correct: <strong>{{match.correct}}</strong>)</span>
                    </span>
                </span>
            </div>
        </div>
    </div>
    <div ng-show="view.isGraded() && config.showExplanations && currentQuestion.hasExplanations">
        <div ng-show="config.markdown" ng-bind-html="currentQuestion.explanation | doubleNewlines | markdown:this"></div>
        <div ng-hide="config.markdown" ng-bind-html="currentQuestion.explanation | plaintext"></div>
    </div>
    <div class="form-group">
        <button type="button" class="btn btn-default btn-lg btn-block" ng-show="view.isNotGraded()" ng-click="grade()">
            <span class="label label-default keyboard-shortcut">Enter</span>
            Check answers
        </button>
        <button type="submit" class="btn btn-info btn-lg btn-block" ng-show="view.isGraded() && questionIndex < questions.length">
            <span class="label label-default keyboard-shortcut">Enter</span>
            Next question
        </button>
        <button type="button" class="btn btn-default btn-lg btn-block" ng-show="view.isGraded() && currentQuestion.hasExplanations && !config.showExplanations && config.explain != 'summary'" ng-click="config.showExplanations = true">Explain answers</button>
        <button type="submit" class="btn btn-success btn-lg btn-block" ng-show="view.isGraded() && questionIndex >= questions.length">End test</button>
    </div>
</form>
